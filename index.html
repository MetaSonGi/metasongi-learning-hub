<!doctype html><html lang="ko"><meta charset="utf-8"><title>MetaSonGi Learning Hub</title><style>body{margin:0;background:#0d1220;color:#e9efff;font:16px system-ui}main{max-width:1000px;margin:40px auto;padding:24px}h1{color:#68e4cf}section{background:#192238;padding:24px;border-radius:16px;margin:16px 0}button,input,textarea,select{font:inherit;padding:10px;border-radius:8px;margin:6px}button{background:#68e4cf;border:0;cursor:pointer}textarea{width:90%;min-height:100px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#68e4cf}.muted{color:#a6b4d0}</style><main><h1>MetaSonGi Learning Hub</h1><p>무료 로컬 학습실 · LMS + 관심별 경로 + xAPI 형식 기록</p><p class="muted">개인용 MVP입니다. 계정·공식 LRS·수료증 서비스는 아직 없습니다.</p><select id="interest"><option value="all">전체 학습 경로</option><option value="robot">로봇</option><option value="xr">XR</option></select><div id="courses"></div><button id="export">학습 기록 JSON 내려받기</button><pre id="message"></pre></main><script>
let state; const $=id=>document.getElementById(id);
async function request(url,data){let r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function load(){state=await request('/api/courses');render()}
function render(){let host=$('courses');host.replaceChildren();for(let c of state.courses){if($('interest').value!='all'&&$('interest').value!=c.tag)continue;let s=document.createElement('section'),h=document.createElement('h2');h.textContent=c.title;s.append(h);let done=state.progress.filter(x=>x[0]===c.id).length;let p=document.createElement('p');p.textContent=`진도 ${done}/${c.lessons.length} · 퀴즈 ${state.scores.some(x=>x[0]===c.id&&x[1])?'통과':'미통과'}`;s.append(p);c.lessons.forEach((l,i)=>{let t=document.createElement('h3');t.textContent=l.title;let a=document.createElement('p');a.textContent=l.text;let b=document.createElement('button');b.textContent=state.progress.some(x=>x[0]===c.id&&x[1]===i)?'학습 완료 ✓':'읽고 완료하기';b.onclick=()=>act('/api/complete',{course:c.id,lesson:i});s.append(t,a,b)});let q=document.createElement('p');q.textContent=c.question;s.append(q);c.options.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>act('/api/quiz',{course:c.id,choice:i});s.append(b)});host.append(s)}}
async function act(url,data){try{let r=await request(url,data);$('message').textContent=JSON.stringify(r.result,null,2);await load()}catch(e){$('message').textContent=e.message}}
$('interest').onchange=render;$('export').onclick=async()=>{let b=new Blob([JSON.stringify(await request('/api/events'),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='learning-statements.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};load().catch(e=>$('message').textContent=e.message);
</script></html>
